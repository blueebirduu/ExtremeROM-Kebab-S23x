name: Build ExtremeROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [dm1q, dm2q, dm3q]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /usr/share/miniconda /usr/share/az_* /usr/share/gradle*
          sudo rm -rf /usr/share/man /usr/share/doc /usr/share/doc-base /usr/share/info
          sudo rm -rf /opt/hostedtoolcache /opt/pipx /opt/az /opt/microsoft /opt/google
          sudo docker image prune --all --force
          sudo docker builder prune -a
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo journalctl --vacuum-time=1s
          sudo rm -rf /var/log/*
          sudo rm -rf /usr/lib/jvm/*src.zip /usr/lib/jvm/*demo /usr/lib/jvm/*man
          sudo rm -rf /usr/share/dotnet /usr/local/share/chromium /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/node_modules/npm/man
          sudo rm -rf /usr/local/lib/node_modules/npm/doc
          sudo rm -rf /usr/local/lib/node_modules/npm/html
          sudo rm -rf /usr/local/lib/node_modules/npm/scripts
          sudo find / -type d -name __pycache__ -exec rm -rf {} +
          sudo find / -type f -name '*.pyc' -delete

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Build dependencies
        run: source ./buildenv.sh ${{ matrix.target }}

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/download_fw.sh --force

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/extract_fw.sh --force

      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SOURCE_FIRMWARE="$TARGET_FIRMWARE" ./scripts/download_fw.sh --force

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SOURCE_FIRMWARE="$TARGET_FIRMWARE" ./scripts/extract_fw.sh --force

      - name: Cleanup out/odin and leave placeholder
        run: |
          rm -rf out/odin/
          mkdir -p out/odin/SM-S938B_EUX
          touch out/odin/SM-S938B_EUX/.downloaded

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeROM-${{ matrix.target }}
          path: |
            out/*.zip
